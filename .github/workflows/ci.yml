name: CI
on:
  push:
    branches: [ main, feat/governance ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Run Forge build
        run: forge build
      - name: Run Forge tests
        run: forge test -vvv
